name: Safe CPU contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out complete history for the DP pair audit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Python and cache only dependency downloads
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements/ci-cpu.txt
      - name: Install the hash-locked CPU dependencies
        timeout-minutes: 10
        run: python -m pip install --require-hashes -r requirements/ci-cpu.txt
      - name: Run the explicit CPU contracts, interface and full-source startup checks
        timeout-minutes: 4
        run: python scripts/check_merge_candidate.py --output "$RUNNER_TEMP/ygo-safe-cpu"
      - name: Preserve only test names and aggregate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safe-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ygo-safe-cpu/tests.log
            ${{ runner.temp }}/ygo-safe-cpu/results.json
          if-no-files-found: warn
          retention-days: 7
